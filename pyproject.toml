[project]
name = "paper-pdf-retriever"
version = "0.1.0"
description = "Retrieve academic paper PDFs from multiple sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "arxiv>=2.0.0",
    "habanero>=1.2.0",
    "semanticscholar>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
unofficial = [
    "scidownl>=1.0.0",
]
institutional = [
    "selenium>=4.0.0",
    "webdriver-manager>=4.0.0",
]

[project.scripts]
paper-retriever = "paper_retriever.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_retriever"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
